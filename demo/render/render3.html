<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#0b0f14}#box{width:384px;height:288px}x3d-canvas{display:block;width:100%;height:100%}</style>
<script src="xite/x_ite.min.js"></script></head><body><div id="box"></div>
<script>
/* Frame watcher registered BEFORE the scene is loaded, sampling the WebGL canvas inside X_ITE's own end-of-frame callback (the drawing buffer is cleared after the frame is shown).
   X_ITE renders on demand: how long frames keep coming after a load depends on the scene and on the machine, so nothing here waits for a frame to arrive. */
const c=document.createElement('x3d-canvas');['splashScreen','contextMenu','notifications','timings'].forEach(a=>c.setAttribute(a,'false'));document.getElementById('box').appendChild(c);
window.initCss=async()=>{const t=(await (await fetch('xite/x_ite.css')).text()).replace(/url\(assets\//g,'url(xite/assets/');const st=document.createElement('style');st.textContent=t;c.shadowRoot.appendChild(st);c.shadowRoot.querySelector('.x_ite-private-browser').style.display='block'};
function grab(){const B=c.browser,cv=B.getCanvas(),w=cv.width,h=cv.height,t2=document.createElement('canvas');t2.width=w;t2.height=h;const cx=t2.getContext('2d',{willReadFrequently:true});cx.drawImage(cv,0,0);const d=cx.getImageData(0,0,w,h).data;
  const cnt=new Map();for(let i=0;i<d.length;i+=16){const k=(d[i]>>3)<<10|(d[i+1]>>3)<<5|(d[i+2]>>3);cnt.set(k,(cnt.get(k)||0)+1)}let bg=0,best=-1;for(const[k,v]of cnt)if(v>best){best=v;bg=k}
  const br=(bg>>10&31)<<3,bgc=(bg>>5&31)<<3,bb=(bg&31)<<3;let diff=0,n=0;for(let i=0;i<d.length;i+=4){n++;if(Math.abs(d[i]-br)+Math.abs(d[i+1]-bgc)+Math.abs(d[i+2]-bb)>48)diff++}
  return{nb:+(diff/n).toFixed(4),cv:t2}}
window.measure=async(x,settle,maxs)=>{const B=c.browser,F=typeof B.finishEvents==='function'?B.finishEvents():B.endEvents(),sleep=ms=>new Promise(r=>setTimeout(r,ms)),out={},fr=[],key=Symbol();let t0=null,best=null,ns=0,lastS=-1e9;
  F.addFieldCallback(key,()=>{if(t0===null)return;const t=Math.round(performance.now()-t0);fr.push(t);
    if(ns<(maxs||20)&&(ns<8||t-lastS>=150)){ns++;lastS=t;let g=null;try{g=grab()}catch(e){}if(g){(out.series=out.series||[]).push(g.nb);if(!best||g.nb>best.nb)best=g}}});
  try{const sc=await B.createX3DFromString(x);t0=performance.now();await B.replaceWorld(sc);out.repMs=Math.round(performance.now()-t0);out.nodes=B.currentScene.rootNodes.length;
    try{B.getActiveLayer().viewAll(0)}catch(e){}
    await sleep(settle||3500)}catch(e){out.err=String(e).slice(0,240)}
  F.removeFieldCallback(key);out.frames=fr.length;out.first=fr[0]??null;out.last=fr[fr.length-1]??null;out.nonblank=best?best.nb:null;out.png=best?best.cv.toDataURL('image/png'):null;return out};
</script></body></html>
